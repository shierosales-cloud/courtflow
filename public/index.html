<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CourtFlow</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0C2230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CourtFlow">
<link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#EDF1EA;--panel:#fff;--ink:#0F2B3A;--muted:#5A7280;--border:#CBD7CE;--court:#1E6A8A;--cl:#F4F8F2;--ball:#D9E84B;--ballink:#1B2A05;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C2230;--panel:#12303F;--ink:#EAF1EC;--muted:#8FA9B6;--border:#23475A;--court:#1B5E7C}}
:root[data-theme="dark"]{--bg:#0C2230;--panel:#12303F;--ink:#EAF1EC;--muted:#8FA9B6;--border:#23475A;--court:#1B5E7C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 'DM Sans',system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 2.6rem/1 'Barlow Condensed','Arial Narrow',sans-serif;margin:0}
.brand{margin:0 0 8px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{display:block;width:100%;max-width:900px;height:auto;margin:0 auto}.l-dark{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .l-light{display:none}:root:not([data-theme="light"]) .l-dark{display:block}}
:root[data-theme="dark"] .l-light{display:none}:root[data-theme="dark"] .l-dark{display:block}
.sub{color:var(--muted);margin:0 0 16px;text-align:center}
.inst{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:0 0 16px;font-size:.92rem}.inst button{min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:700 1rem 'DM Sans',sans-serif;cursor:pointer}.inst .cl{background:none;color:var(--muted);text-decoration:underline;font-weight:400}
.tag{font:600 1.35rem/1.1 'Barlow Condensed',sans-serif;letter-spacing:.04em;color:var(--court);margin:0 0 6px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:var(--ball)}}
#settings{display:flex;flex-wrap:wrap;gap:10px 22px;margin-bottom:20px;align-items:center}
.grp{display:flex;align-items:center;gap:6px}.grp>span{color:var(--muted);font-size:.9rem;margin-right:2px}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink);padding:10px 14px;min-height:44px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:700}
.seg b{padding:0 6px;min-width:34px;text-align:center;align-self:center}
.main{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
@media(max-width:820px){.main{grid-template-columns:1fr}aside{order:-1}}
#courts{display:grid;gap:16px}
#courts.four{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,auto));align-items:stretch}
#courts.four .court{min-width:0}
@media(max-width:560px){#courts.four{gap:8px}#courts.four .court{padding:8px}#courts.four .surf{gap:5px;padding:6px;min-height:105px}#courts.four .surf li{font-size:1.2rem}}
.court{background:var(--court);color:var(--cl);border-radius:14px;padding:14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ch b{font:700 1.3rem 'Barlow Condensed',sans-serif}
.surf{display:grid;grid-template-columns:1fr 6px 1fr;gap:12px;border:2px solid var(--cl);border-radius:6px;padding:12px;min-height:130px}
.surf.empty{display:flex;align-items:center;justify-content:center;text-align:center;border-style:dashed;opacity:.9}
.net{background:repeating-linear-gradient(var(--cl) 0 6px,transparent 6px 12px);border-radius:3px}
.surf small{opacity:.8}.surf ul{list-style:none;margin:4px 0 0;padding:0}
.surf li{font:600 1.7rem/1.2 'Barlow Condensed',sans-serif;overflow-wrap:anywhere}
.row{display:flex;gap:10px;margin-top:12px}.row .btn{flex:1}
.btn{min-height:46px;padding:0 16px;border-radius:10px;border:2px solid var(--cl);background:none;color:var(--cl);font:700 1rem 'DM Sans',sans-serif;cursor:pointer;margin-top:0}
.btn.primary{background:var(--ball);border-color:var(--ball);color:var(--ballink);width:100%;margin-top:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--cl);text-decoration:underline;font:inherit;font-size:.9rem;cursor:pointer;padding:8px 0}
button:focus-visible,input:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
aside{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
aside h2{font:700 1.5rem 'Barlow Condensed',sans-serif;margin:0 0 10px}
form{display:flex;gap:8px}
[hidden]{display:none!important}
input{flex:1;min-width:0;min-height:46px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
form button{min-height:46px;padding:0 16px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:700 1rem 'DM Sans',sans-serif;cursor:pointer}
#msg{min-height:1.4em;color:var(--muted);font-size:.9rem;margin:6px 0}
#queue{list-style:none;margin:0;padding:0}
#queue li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;border-left:5px solid transparent}
#queue li.next{background:color-mix(in srgb,var(--ball) 28%,transparent);border-left-color:var(--ball)}
#queue .n{width:1.6em;color:var(--muted);font-variant-numeric:tabular-nums}
#queue .nm{flex:1;font-weight:500;overflow-wrap:anywhere}
#queue .x{border:0;background:none;color:var(--muted);font-size:1.2rem;min-width:40px;min-height:40px;cursor:pointer}
.empty-q{color:var(--muted)}
@media(prefers-reduced-motion:no-preference){.btn,.seg button{transition:background .15s}}
.hint{color:var(--muted);margin:-8px 0 18px;font-size:.92rem}
.btn.go{background:var(--ball);border-color:var(--ball);color:var(--ballink)}
.sec{width:100%;min-height:46px;margin:12px 0 4px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--ink);font:700 1rem 'DM Sans',sans-serif;cursor:pointer}
#sched h3{font:700 1.2rem 'Barlow Condensed',sans-serif;margin:10px 0 4px}
#sched ul{list-style:none;margin:0 0 8px;padding:0}
#sched li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px dashed var(--border);border-radius:8px;margin-bottom:6px}
#sched li span{flex:1;font-weight:500}
#sched .x{border:0;background:none;color:var(--muted);font-size:1.2rem;min-width:40px;min-height:40px;cursor:pointer}
.rec{color:var(--muted);font-weight:400}
.lv{border:1px solid var(--border);background:none;color:var(--ink);border-radius:999px;padding:0 10px;min-height:36px;font:500 .85rem 'DM Sans',sans-serif;cursor:pointer}
select{min-height:46px;font:inherit;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--ink);padding:0 8px}
form select{width:auto}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--panel);color:var(--ink);padding:18px;width:min(420px,92vw)}
dialog::backdrop{background:#0008}
dialog h2{font:700 1.5rem 'Barlow Condensed',sans-serif;margin:0 0 10px}
dialog label,dialog b{display:block;margin-top:8px}
dialog select{width:100%;margin:4px 0}
#dmsg{min-height:1.4em;color:var(--muted);margin:8px 0}
.drow{display:flex;gap:8px;justify-content:flex-end}
.drow button{min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--ink);font:700 1rem 'DM Sans',sans-serif;cursor:pointer}
.drow button:last-child{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#board{margin-top:22px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
#board h2{font:700 1.5rem 'Barlow Condensed',sans-serif;margin:0 0 4px}
.lbn{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.top3{display:grid;gap:8px;margin-bottom:14px}
.tp{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:2px solid var(--mc)}
.tp.r1{--mc:#E3B72F;background:color-mix(in srgb,#E3B72F 22%,var(--panel))}
.tp.r2{--mc:#9AA7B0;background:color-mix(in srgb,#9AA7B0 20%,var(--panel))}
.tp.r3{--mc:#C0803F;background:color-mix(in srgb,#C0803F 20%,var(--panel))}
.tp .md{width:40px;height:40px;border-radius:50%;background:var(--mc);color:#1B1B1B;display:grid;place-items:center;font:700 1.4rem 'Barlow Condensed',sans-serif}
.tp b{display:block;font:700 1.4rem/1.1 'Barlow Condensed',sans-serif;overflow-wrap:anywhere}
.tp small{color:var(--muted)}
.tp .rt{font:700 1.8rem 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.tbw{overflow-x:auto}
#board table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:420px}
#board th{font-weight:500;color:var(--muted);font-size:.85rem;text-align:right;padding:6px 8px;border-bottom:2px solid var(--border)}
#board td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--border)}
#board th:nth-child(2),#board td:nth-child(2){text-align:left;overflow-wrap:anywhere}
#board th:first-child,#board td:first-child{text-align:left;width:2.2em;color:var(--muted)}
#board td.w{color:#2E7D32;font-weight:700}#board td.l{color:#B3412F;font-weight:700}
#board td.rt{font-weight:700}
#board tr.t3 td{background:color-mix(in srgb,var(--ball) 24%,transparent);font-weight:700}
#board .unr td{color:var(--muted)}
.lu{margin-top:22px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
.lu h2{font:700 1.5rem 'Barlow Condensed',sans-serif;margin:0 0 4px}
.lrow{display:flex;gap:8px;margin-bottom:12px}.lrow select{flex:1;min-width:0}
.lb{min-height:46px;padding:0 16px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:700 1rem 'DM Sans',sans-serif;cursor:pointer}
#lineup ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#lineup li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:12px}
#lineup li.nx{border:2px solid var(--ball);background:color-mix(in srgb,var(--ball) 24%,transparent)}
#lineup .gn{font:700 1.3rem 'Barlow Condensed',sans-serif;min-width:4.4em}
#lineup .ty2{display:block;color:var(--muted);font-size:.85rem}
#lineup .pl{font-weight:700;overflow-wrap:anywhere}
#lineup .need{color:var(--muted)}
#lineup .x{border:0;background:none;color:var(--muted);font-size:1.2rem;min-width:40px;min-height:40px;cursor:pointer}
.court.held{outline:3px dashed var(--ball);outline-offset:2px}
.hc{font:700 1.3rem 'Barlow Condensed',sans-serif;color:var(--ball)}
.link2{margin-top:8px;min-height:40px;background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:.9rem;cursor:pointer}
.tm{font:700 1.5rem 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.court.up{outline:4px solid var(--ball);outline-offset:2px}
.court.up .tm{color:var(--ball)}
#mins{flex:none;width:76px;text-align:center}
.lv{font-size:.8rem;white-space:nowrap}
form{flex-wrap:wrap}#in{flex:1 1 100%}form select{flex:1}
#queue li{flex-wrap:wrap}#queue .nm{flex:1 1 90px}
.ty{min-height:36px;padding:0 6px;background:transparent;color:var(--cl);border:1px solid var(--cl);border-radius:8px;font:inherit;font-size:.85rem}
.ty option{color:#0F2B3A;background:#fff}
.ch .ty{margin-right:auto;margin-left:10px}
.sc{width:5.5em;min-height:40px;margin-top:8px;background:transparent;color:var(--cl);border:1px solid var(--cl);border-radius:8px;text-align:center;font:inherit}
.sc::placeholder{color:var(--cl);opacity:.6}
#hist{margin-top:22px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
#hist h2{font:700 1.5rem 'Barlow Condensed',sans-serif;margin:0 0 8px}
#hist ul{list-style:none;margin:0;padding:0}
#hist li{padding:8px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}

#tabs,#htabs{display:flex;gap:6px;margin:0 0 16px;overflow-x:auto;padding-bottom:2px}
#tabs button,#htabs button{flex:1 0 auto;min-height:46px;padding:0 18px;border:1px solid var(--border);border-radius:999px;background:var(--panel);color:var(--ink);font:700 1rem 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap}
#tabs button[aria-selected=true],#htabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.st{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px}.st b{display:block;font:700 2rem/1 'Barlow Condensed',sans-serif}.st span{color:var(--muted);font-size:.85rem}
.ch{flex-wrap:wrap;gap:4px 10px}.court.emp{background:transparent;border:2px dashed var(--border);color:var(--muted)}.court.emp .surf{border-color:var(--border)}.court.emp .btn{color:var(--ink);border-color:var(--border)}
.la{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}
#queue li.pz{opacity:.55}#queue li.pz .nm{text-decoration:line-through}#queue li.oc{background:color-mix(in srgb,var(--court) 12%,transparent)}
#p-players{max-width:640px}#p-play>.sec{max-width:420px}
#sess{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}#sess h2{font:700 1.5rem 'Barlow Condensed',sans-serif;margin:0 0 8px}#sess h3{font:700 1.2rem 'Barlow Condensed',sans-serif;margin:14px 0 6px}
#sess details{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}#sess summary{cursor:pointer;min-height:36px}
#sess table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:360px}#sess th,#sess td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--border)}#sess th{color:var(--muted);font-weight:500;font-size:.85rem}#sess th:nth-child(2),#sess td:nth-child(2){text-align:left}
#sess ul{list-style:none;margin:0;padding:0}#sess li{padding:6px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}
.cs{padding:10px 12px;border:2px solid var(--ball);border-radius:12px;margin-bottom:12px;background:color-mix(in srgb,var(--ball) 18%,transparent)}
#sess .lrow input{flex:1}

.insess .logo{max-width:600px}.insess .brand{margin-bottom:12px}
#home{max-width:640px;margin:0 auto}#htabs button{flex:1}
.fl{display:block;margin:0 0 10px;color:var(--muted)}.fl input{display:block;width:100%;margin-top:4px;color:var(--ink)}
.ck{display:flex;gap:10px;align-items:center;margin:10px 0;color:var(--ink)}.ck input{min-height:0;flex:none;width:22px;height:22px}
.lb.big{width:100%;min-height:52px}
#sesshead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:0 0 14px}
#sesshead b{font:700 1.4rem 'Barlow Condensed',sans-serif}#sesshead small{display:block;color:var(--muted)}
#sesshead .sa{display:flex;gap:6px;align-items:center}#sesshead .sa .link2{margin:0}
.sm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.sm div{background:var(--bg);border-radius:10px;padding:8px 10px}.sm b{display:block;font:700 1.3rem 'Barlow Condensed',sans-serif;overflow-wrap:anywhere}.sm span{color:var(--muted);font-size:.8rem}

.gen{border:1px dashed var(--border);border-radius:12px;padding:12px;margin-bottom:14px}.gen>b{font:700 1.2rem 'Barlow Condensed',sans-serif}
.gt{display:flex;flex-wrap:wrap;gap:0 16px}.gen .lrow{align-items:center;margin:6px 0}.gen .fl2{display:flex;gap:8px;align-items:center;flex:1}.gen .fl2 input{width:90px;flex:none;text-align:center}
#lineup .gm{color:var(--ink);font-size:.9rem;margin:6px 0 0}

/* ===== v7 polish ===== */
:root{--ta:#2E9E5B;--tat:#1B7A42;--tb:#E0508F;--tbt:#B42A6A;--good:#1F8A4C;--bad:#C2432F;--acc:#1E6A8A;--sh:0 1px 2px rgba(12,34,48,.06),0 8px 22px rgba(12,34,48,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ta:#5FD08A;--tat:#8FE3AE;--tb:#F58BB8;--tbt:#FFB3D2;--good:#43C07A;--bad:#F07C68;--acc:#3AA0C8;--sh:0 1px 2px #0005,0 8px 22px #0004}}
:root[data-theme="dark"]{--ta:#5FD08A;--tat:#8FE3AE;--tb:#F58BB8;--tbt:#FFB3D2;--good:#43C07A;--bad:#F07C68;--acc:#3AA0C8;--sh:0 1px 2px #0005,0 8px 22px #0004}
body{-webkit-font-smoothing:antialiased}
#board,#hist,.lu,#sess,#sesshead,aside,.st,#settings,.court{border-radius:18px;box-shadow:var(--sh)}
h2{letter-spacing:.01em}
/* tabs */
#tabs,#htabs{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:4px;gap:4px;box-shadow:var(--sh)}
#tabs button,#htabs button{border:0;background:transparent;border-radius:12px;color:var(--muted)}
#tabs button[aria-selected=true],#htabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
/* session banner */
#sesshead{background:#0C2230;color:#EAF1EC;border:0}
#sesshead small{color:#9DB6C2}#sesshead .link2{color:#CFE0E8}
#sesshead .lb{background:var(--ball);color:var(--ballink)}
/* stat tiles */
.st{display:flex;flex-direction:column-reverse;gap:2px}.st b{color:var(--acc)}
/* settings */
#settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 36px;background:var(--panel);border:1px solid var(--border);padding:4px 18px;margin-bottom:12px}
.srow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:13px 0;border-bottom:1px solid var(--border)}
.sl b{display:block;font-weight:700}.sl small{display:block;color:var(--muted);font-size:.82rem;max-width:30ch}
.ctl{margin-left:auto;display:flex;align-items:center;gap:8px}
.srow.wide .ctl{flex:1 0 100%;margin:0}.srow.wide .seg{width:100%}.srow.wide .seg button{flex:1;padding:10px 6px;font-size:.88rem}
.ctl .btn2{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font:700 .9rem 'DM Sans',sans-serif;cursor:pointer}
.seg{border-radius:12px;background:var(--bg)}
.hint{background:color-mix(in srgb,var(--acc) 9%,transparent);border-radius:10px;padding:9px 12px;margin:0 0 16px}
/* toggle switch */
.sw{position:relative;width:48px;height:28px;border-radius:99px;border:0;padding:0;flex:none;cursor:pointer;background:color-mix(in srgb,var(--muted) 40%,var(--panel));transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0005;transition:transform .2s}
.sw[aria-checked=true]{background:var(--acc)}.sw[aria-checked=true] i{transform:translateX(20px)}
.sw::after{content:"";position:absolute;inset:-9px -4px}
.ck input{-webkit-appearance:none;appearance:none;position:relative;width:48px;height:28px;border-radius:99px;flex:none;cursor:pointer;padding:0;border:0;background:color-mix(in srgb,var(--muted) 40%,var(--panel));transition:background .2s}
.ck input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0005;transition:transform .2s}
.ck input:checked{background:var(--acc)}.ck input:checked::after{transform:translateX(20px)}
.ck{flex-direction:row-reverse;justify-content:space-between;font-weight:500}
.gt{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 28px}
/* courts */
#courts{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.court{background:linear-gradient(160deg,#1F7396,#134763);padding:16px}
.ch b{font-size:1.5rem}
.surf{display:block;min-height:0;border:2px solid rgba(255,255,255,.55);border-radius:12px;padding:10px}
.surf.empty{display:block;padding:14px 10px}.surf.empty>p{margin:0;text-align:center}
.nu{font-weight:700;opacity:.85;margin:0 0 8px!important}
.court .mt{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);border-top-color:var(--c)}
.court .mt .tl{color:#fff}.court .mt li{font:600 1.5rem/1.2 'Barlow Condensed',sans-serif;color:#fff}
.court .vsb{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff}
.court .mt.a{--c:#7EE0A3}.court .mt.b{--c:#FF9CC7}
.sc{width:100%;margin-top:8px;font-size:1.2rem;font-weight:700}
.cf{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn.wa{background:#C5F0D5;border-color:#C5F0D5;color:#0B3A1E}.btn.wb{background:#FFD0E4;border-color:#FFD0E4;color:#4A0F2A}
.btn{border-radius:12px}
/* team matchup */
.mu{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.mt{--c:var(--ta);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);border-top:4px solid var(--c);border-radius:12px;padding:9px 12px;background:color-mix(in srgb,var(--c) 9%,var(--panel));min-width:0}
.mt.b{--c:var(--tb)}
.mt .tl{display:block;font:700 .75rem 'DM Sans',sans-serif;color:var(--tat);margin-bottom:4px}.mt.b .tl{color:var(--tbt)}
.mt ul{list-style:none;margin:0;padding:0}.mt li{font-weight:700;padding:2px 0;overflow-wrap:anywhere}
.vsb{align-self:center;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--muted);font:700 .8rem 'DM Sans',sans-serif;text-transform:uppercase}
/* line-up */
#lineup li{display:block;padding:12px}
.gh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}.gh .gn{min-width:0;margin-right:4px}.gh .la{margin-left:auto}
.bd{font-size:.74rem;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--border);color:var(--muted);font-weight:500}.bd.nx{background:var(--ball);border-color:var(--ball);color:var(--ballink);font-weight:700}
#lineup .need{display:block;margin:0}
.pcnt{margin:0 0 14px;border:1px solid var(--border);border-radius:14px;padding:12px}.pcnt>b{font:700 1.2rem 'Barlow Condensed',sans-serif}
.pcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:6px}
.pcg div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:10px;background:var(--bg)}
.pcg span{overflow-wrap:anywhere;font-weight:500}.pcg b{min-width:30px;text-align:center;border-radius:99px;background:var(--acc);color:#fff;padding:1px 8px;font-variant-numeric:tabular-nums}
#sched li{align-items:flex-start;border-style:solid}#sched li>div{flex:1}#sched .gn{display:none}

/* Ultra-compact Matches Per Player cards: one-line stats, no nested stat tiles */
.pcg{grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:6px}
.pcg .pcard{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:3px;min-width:0;padding:6px 8px;border:1px solid var(--border);border-radius:9px;background:var(--bg)}
.pcg .pcard-head{display:flex;align-items:center;justify-content:space-between;gap:5px;min-width:0;padding:0;margin:0;background:transparent}
.pcg .pcard-head>strong{min-width:0;font-size:.82rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.pcg .pcard .pcard-total{flex:0 0 auto;min-width:0;white-space:nowrap;padding:1px 6px;border-radius:99px;background:var(--acc);color:#fff;font-size:.65rem;font-weight:700}
.pcg .pcard-stats{display:flex;align-items:center;flex-wrap:wrap;gap:2px 7px;padding:0;margin:0;background:transparent;font-size:.68rem;line-height:1.2}
.pcg .pcard-stats span{display:inline-flex;align-items:baseline;gap:2px;padding:0;margin:0;background:transparent;font-size:inherit;line-height:inherit;white-space:nowrap}
.pcg .pcard-stats i{font-style:normal;color:var(--muted)}
.pcg .pcard-stats b{min-width:0;padding:0;margin:0;background:transparent;color:var(--ink);font-size:inherit;font-weight:700}
.pcg .pcard-wait{display:flex;align-items:center;justify-content:flex-start;gap:4px;padding:0;margin:0;background:transparent;font-size:.68rem;line-height:1.15;white-space:nowrap}
.pcg .pcard-wait span{color:var(--muted);font-weight:500}
.pcg .pcard-wait strong{font-size:inherit;font-weight:700;font-variant-numeric:tabular-nums}
@media(max-width:520px){.pcg{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.pcg .pcard{padding:5px 7px}.pcg .pcard-head>strong{font-size:.78rem}}
.upteams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin:8px 0}.upteam{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:5px;font-weight:650}.upteam b{font-size:.68rem;letter-spacing:.08em}.upa{background:color-mix(in srgb,#2685c7 16%,var(--panel));border:1px solid #2685c7}.upb{background:color-mix(in srgb,#b7791f 16%,var(--panel));border:1px solid #b7791f}.upvs{align-self:center;font-size:.7rem;font-weight:800;color:var(--muted)}.upr{display:block;padding:10px;border:1px solid var(--border);border-radius:14px;margin:8px 0}
#hist-search{width:100%;margin:8px 0 12px;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--ink)}
/* recent matches */
ul.ml{display:grid;gap:10px}
#hist li.mc,#sess li.mc{display:block;padding:12px;border:1px solid var(--border);border-radius:14px}
.mh{display:flex;gap:6px;align-items:center;margin-bottom:10px}.mh b{font-size:.95rem}
.chip{font-size:.74rem;padding:2px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}.chip.nw{background:var(--ball);border-color:var(--ball);color:var(--ballink);font-weight:700}
.mt.lose{opacity:.72}.mt.win{background:color-mix(in srgb,var(--c) 16%,var(--panel));border-color:var(--c)}
.wbd{font:700 .68rem 'DM Sans',sans-serif;font-style:normal;color:#fff;background:var(--good);border-radius:99px;padding:1px 8px;margin-left:6px}
.mid{display:flex;align-items:center;gap:6px;font:700 1.9rem/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;color:var(--muted);align-self:center}.mid .wn{color:var(--good)}.mid i{font-style:normal;opacity:.6}
/* tables: equal columns */
#board .lt,#sess .lt{table-layout:fixed;min-width:0;width:100%}
#board .lt th,#sess .lt th{text-align:center;width:64px}#board .lt td,#sess .lt td{text-align:center}
#board .lt th:first-child,#board .lt td:first-child,#sess .lt th:first-child,#sess .lt td:first-child{width:40px}
#board .lt th:nth-child(2),#board .lt td:nth-child(2),#sess .lt th:nth-child(2),#sess .lt td:nth-child(2){text-align:left;width:auto}
#board .lt th:last-child{width:72px}
.pt{width:100%;table-layout:fixed;border-collapse:collapse;font-variant-numeric:tabular-nums}
.pt th{font-weight:600;color:var(--muted);font-size:.8rem;padding:8px 4px;text-align:center;border-bottom:2px solid var(--border)}
.pt td{padding:9px 4px;text-align:center;border-bottom:1px solid var(--border);vertical-align:middle}
.pt .pn{text-align:left;padding-left:8px}.pt .pn b{display:block;overflow-wrap:anywhere}.pt .pn small{display:block;color:var(--muted);font-size:.8rem}
#p-players .pt .pn{display:flex;align-items:center;gap:7px;min-width:150px}#p-players .pt .pupload{flex:0 0 auto;margin:0}#p-players .pt .pn>span{min-width:0}#p-players .pt .pn b{display:block}
.k-n{width:44px}.k-l{width:176px}.k-g{width:88px}.k-w,.k-r,.k-p{width:70px}.k-s{width:80px}.k-x{width:44px}
.pt .lv{width:100%;max-width:166px;padding:0 8px;font-size:.82rem}.pt .lf{white-space:nowrap}.pt .lv.ro{display:inline-flex;align-items:center;justify-content:center;opacity:.6}
.pt .x{border:0;background:none;color:var(--muted);font-size:1.3rem;min-width:36px;min-height:36px;cursor:pointer}
.pt tr.next td{background:color-mix(in srgb,var(--ball) 26%,transparent)}.pt tr.oc td{background:color-mix(in srgb,var(--court) 10%,transparent)}
.pt tr.pz td:not(.tg){opacity:.5}

.player-search{display:flex;align-items:center;gap:10px;margin:8px 0 10px;color:var(--muted);font-size:.84rem;font-weight:600}
.player-search input{flex:1;min-width:0;max-width:420px;padding:8px 11px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--ink);font:inherit}
.pt .k-st{width:64px}.pt .stats-col{min-width:52px;min-height:28px;padding:2px 7px;font-size:.75rem}

/* Compact player rows in the Players tab while keeping controls usable. */

#p-players .pt .pn b{font-size:.9rem;line-height:1.15}
#p-players .pt .pn small{font-size:.68rem;line-height:1.2;margin-top:1px}

@media(max-width:900px){#p-players .pt th{padding:4px 2px}#p-players .pt td{padding:4px 2px}#p-players .pt .pn b{font-size:.84rem}#p-players .pt .pn small{font-size:.65rem}}
.sf,.ms{display:none}
#qsum{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}#qsum span{padding:4px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--border);font-size:.85rem;color:var(--muted)}#qsum b{color:var(--ink);font-variant-numeric:tabular-nums}

#f{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:4px}#f #in{grid-column:1/-1}
#queue{margin-top:8px}
/* dialog */
.dtm{margin:12px 0 2px;font:700 .8rem 'DM Sans',sans-serif;padding:3px 10px;border-radius:99px;display:inline-block;color:#fff;background:var(--tat)}.dtm.b{background:var(--tbt)}
dialog{border-radius:18px;box-shadow:0 20px 60px #0006}
@media(max-width:900px){.hm{display:none}.ms{display:inline}.k-l{width:54px}.k-g{width:46px}.k-s{width:62px}.k-x{width:38px}.pt .lf{display:none}.pt .sf{display:inline}}
@media(max-width:560px){#board .lt th:nth-child(3),#board .lt td:nth-child(3){display:none}#board .lt th{width:52px}.mu{gap:6px}.mt{padding:8px}.court .mt li{font-size:1.3rem}.vsb{width:26px;height:26px;font-size:.7rem}.mid{font-size:1.5rem}}

#scale{margin-top:24px}#scale h3{font:700 1.3rem 'Barlow Condensed',sans-serif;margin:0 0 2px}

  --court:#1E6A8A;--cl:#F4F8F2;--ball:#D9E84B;--ballink:#1B2A05;
  --acc:#1E6A8A;--good:#218653;--bad:#C94C42;
  --sh:0 2px 6px rgba(16,45,59,.045),0 10px 28px rgba(16,45,59,.075)
}
:root[data-theme="dark"]{
  --bg:#0C2230;--panel:#12303F;--ink:#EAF1EC;--muted:#8FA9B6;--border:#23475A;
  --court:#1B5E7C;--cl:#F4F8F2;--ball:#D9E84B;--ballink:#1B2A05;
  --acc:#62A9C6;--good:#62C58A;--bad:#F08070;--sh:0 2px 8px #0005,0 12px 30px #0004
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C2230;--panel:#12303F;--ink:#EAF1EC;--muted:#8FA9B6;--border:#23475A;
  --court:#1B5E7C;--cl:#F4F8F2;--ball:#D9E84B;--ballink:#1B2A05;
  --acc:#62A9C6;--good:#62C58A;--bad:#F08070;--sh:0 2px 8px #0005,0 12px 30px #0004
}}
html{background:var(--bg);scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 50% -18%,rgba(30,106,138,.075),transparent 48%),var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:1240px;padding:clamp(12px,2vw,24px) clamp(12px,2.2vw,24px) 42px}
.brand{margin-bottom:14px}
.logo{max-width:760px}
h1,h2,h3,.tag{letter-spacing:.012em}
h2{font-size:1.55rem}
button,input,select,textarea{font-family:'DM Sans',system-ui,sans-serif}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--ball) 82%,white);outline-offset:2px}
#tabs,#htabs{padding:5px;gap:5px;border-radius:17px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--sh);margin-bottom:18px}
#tabs button,#htabs button{min-height:44px;border-radius:12px;padding:0 16px;font-weight:700;color:var(--muted);transition:background .16s ease,color .16s ease,transform .16s ease}
#tabs button[aria-selected=true],#htabs button[aria-selected=true]{background:var(--ink);color:#F6FAF7;border-color:var(--ink);box-shadow:0 3px 9px rgba(16,45,59,.16)}
#tabs button:active,#htabs button:active{transform:scale(.98)}
#settings,#board,#hist,.lu,#sess,#sesshead,aside,.st,#home,.lgrp,.gen,.unx{border-radius:18px;box-shadow:var(--sh)}
#settings{background:var(--panel);border:1px solid var(--border);padding:clamp(12px,2vw,20px);gap:12px 18px}
#settings .srow{background:color-mix(in srgb,var(--bg) 62%,var(--panel));border:1px solid var(--border);border-radius:14px;padding:12px 14px;min-height:64px}

.seg{border-radius:12px;border-color:var(--border);box-shadow:inset 0 1px 2px rgba(16,45,59,.035)}
.seg button{border-radius:0;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
input,select,textarea{border-color:var(--border);border-radius:11px;background:var(--panel);color:var(--ink)}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--border))}
.inst,aside,#board,#hist,.lu,#sess{background:var(--panel);border-color:var(--border)}
#sesshead{background:linear-gradient(120deg,#102D3B,#174B52);color:#F2F7F4;padding:14px 16px;border:0}
#sesshead small{color:#B8D0D0}
#stats{gap:12px}
.st{background:linear-gradient(150deg,var(--panel),color-mix(in srgb,var(--acc) 5%,var(--panel)));border:1px solid var(--border);padding:13px 14px;min-height:76px}

.court.up{outline-color:var(--ball)}

.btn,.lb,.sec,.inst button,.drow button{border-radius:11px;transition:transform .14s ease,box-shadow .14s ease,background .14s ease}
.btn:active,.lb:active,.sec:active,.inst button:active,.drow button:active{transform:translateY(1px)}
.lb,.inst button{background:var(--ink);color:#fff}
.lb:hover,.inst button:hover{box-shadow:0 4px 12px rgba(16,45,59,.16)}
.sec{border-color:var(--border);background:var(--panel)}
#queue li,#sched li,#lineup li{border-radius:11px}
#queue li.next,#lineup li.nx{background:color-mix(in srgb,var(--ball) 28%,var(--panel));border-color:var(--ball)}
#p-players .pt{border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--border);border-radius:14px;background:var(--panel)}
#p-players .pt th{background:color-mix(in srgb,var(--bg) 80%,var(--panel));color:var(--muted);font-weight:700}
#p-players .pt td{border-bottom:1px solid var(--border)}
#p-players .pt tr:last-child td{border-bottom:0}
#p-players .pt tbody tr:hover{background:color-mix(in srgb,var(--acc) 5%,var(--panel))}
.player-search input{background:var(--panel);border-radius:12px;min-height:42px}
#board{padding:clamp(12px,2vw,20px)}
#board table,#sess table,#ratings table{border-collapse:separate;border-spacing:0}
#board th,#sess th,#ratings th{background:color-mix(in srgb,var(--bg) 76%,var(--panel));color:var(--muted);font-weight:700}
#board td,#sess td,#ratings td{border-bottom:1px solid var(--border)}
#board tr:last-child td,#sess tr:last-child td,#ratings tr:last-child td{border-bottom:0}
.tp{border-radius:16px;box-shadow:0 5px 16px rgba(16,45,59,.055);overflow:hidden}
.tp.r1{box-shadow:0 8px 24px rgba(217,232,75,.2)}
#hist li{padding:10px 8px}
.lgrp{border-color:var(--border)}
.gxh{border-radius:0}
.lgbody{background:var(--panel)}
dialog{border-radius:18px;box-shadow:0 18px 60px #0003}
.vbtn{box-shadow:0 1px 3px rgba(16,45,59,.06)}
@media(max-width:820px){.wrap{padding:12px 12px 30px}#tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}#settings{padding:12px}}
@media(max-width:560px){#tabs button,#htabs button{min-height:42px;padding:0 11px;font-size:.88rem}.st{min-height:68px;padding:10px}.court{padding:11px}.tp{gap:9px;padding:10px}.tp.r1{padding:13px 11px}}

opacity:.5}#pr-error{color:var(--bad);font-size:.9rem}


/* CourtFlow v27.1 responsive polish: iPad portrait settings, lime actions, theme-safe selections, clean podium photos */
@media (min-width:560px) and (max-width:1100px) and (orientation:portrait){
  #settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:10px}
  #settings .srow{min-width:0}
  #settings .srow:nth-child(1){order:1}
  #settings .srow:nth-child(2){order:2}
  #settings .srow:nth-child(4){order:3;grid-column:1}
  #settings .srow:nth-child(5){order:4;grid-column:2}
  #settings .srow:nth-child(3){order:5;grid-column:1/-1}
  #settings .srow.s6{min-width:0}
  #settings .srow .sl{min-width:0;flex:0 0 auto}
  #settings .srow .ctl{min-width:0;flex:1 1 auto}
  #settings .voicebox select{font-size:.76rem}
}

/* Selected controls remain high-contrast in dark mode; light mode retains navy selection */

:root[data-theme="dark"] #htabs button[aria-selected=true],

}

/* Up Next contrast refinement: darkened slate panel, black team/player names, navy announce action. */
.unx{
  background:#AEBFC3;
  border:1px solid #82999E;
  color:#080F12;
  box-shadow:0 5px 16px rgba(8,28,36,.12);
}
.unx h3,.unx .unl,.unx .lbn,.unx .upnext-match>i{
  color:#080F12;
}
.unx .upr{border-top-color:rgba(8,15,18,.22)}
.unx .nt{color:#080F12;box-shadow:inset 0 0 0 1px rgba(8,15,18,.08)}
.unx .nt.a{background:#B8D1D8;border-left-color:#315F70;color:#080F12}
.unx .nt.b{background:#DCC99F;border-left-color:#80612D;color:#080F12}
.unx .nt em{color:#080F12}
.unx .vbtn{
  background:#102B4C;
  color:#FFFFFF;
  border:1px solid #102B4C;
  box-shadow:0 2px 5px rgba(8,20,35,.18);
  transition:background .15s ease,transform .15s ease,box-shadow .15s ease;
}
.unx .vbtn:hover{background:#183D67;border-color:#183D67;box-shadow:0 3px 8px rgba(8,20,35,.22)}
.unx .vbtn:active{transform:translateY(1px)}
.unx .vbtn:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}

  .unx{padding:13px;border-radius:14px}

  .unx .vbtn{min-height:42px}
}

  padding:clamp(14px,2vw,22px);
